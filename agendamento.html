<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento — Espaço IFMG</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Espaço IFMG</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="agendamento.html">Agendamento</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <main>
<h2>Agendar horário</h2>
<p>Escolha o que deseja agendar:</p>

<div class="seletor">
  <a class="escolha" href="agendamento-sinuca.html">Mesa de Sinuca</a>
  <a class="escolha" href="agendamento-xadrez.html">Tabuleiro de Xadrez</a>
  <a class="escolha" href="agendamento-pingpong.html">Tênis de Mesa</a>
</div>
      <h3>Mesa de Sinuca</h3>
      <form>
        <label for="nome-sinuca">Nome:</label>
        <input type="text" id="nome-sinuca" required>

        <label for="dia-sinuca">Dia:</label>
        <select id="dia-sinuca">
          <option>Segunda</option>
          <option>Terça</option>
          <option>Quarta</option>
          <option>Quinta</option>
        </select>

        <label for="horario-sinuca">Horário:</label>
        <select id="horario-sinuca">
          <option>13h-14h</option>
          <option>14h-15h</option>
          <option>15h-16h</option>
        </select>

        <button type="submit">Agendar</button>
      </form>
    </section>

    <section class="item-agendamento">
      <h3>Tabuleiro de Xadrez</h3>
      <form>
        <label for="nome-xadrez">Nome:</label>
        <input type="text" id="nome-xadrez" required>

        <label for="dia-xadrez">Dia:</label>
        <select id="dia-xadrez">
          <option>Segunda</option>
          <option>Terça</option>
          <option>Quarta</option>
          <option>Quinta</option>
        </select>

        <label for="horario-xadrez">Horário:</label>
        <select id="horario-xadrez">
          <option>13h-14h</option>
          <option>14h-15h</option>
          <option>15h-16h</option>
        </select>

        <button type="submit">Agendar</button>
      </form>
    </section>

    <section class="item-agendamento">
      <h3>Tênis de Mesa</h3>
      <form>
        <label for="nome-pingpong">Nome:</label>
        <input type="text" id="nome-pingpong" required>

        <label for="dia-pingpong">Dia:</label>
        <select id="dia-pingpong">
          <option>Segunda</option>
          <option>Terça</option>
          <option>Quarta</option>
          <option>Quinta</option>
        </select>

        <label for="horario-pingpong">Horário:</label>
        <select id="horario-pingpong">
          <option>13h-14h</option>
          <option>14h-15h</option>
          <option>15h-16h</option>
        </select>

        <button type="submit">Agendar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>IFMG Campus Governador Valadares</p>
  </footer>
</body>
</html>
