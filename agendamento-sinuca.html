<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Sinuca — Espaço IFMG</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Espaço IFMG</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="agendamento.html">Agendamento</a>
      <a href="blog.html">Notícias</a>
    </nav>
  </header>

  <main>
    <p><a href="agendamento.html">&larr; Escolher outra atividade</a></p>

    <div class="item-agendamento">
      <h3>Mesa de Sinuca</h3>
      <form data-atividade="sinuca">
        <label for="nome-sinuca">Nome:</label>
        <input type="text" id="nome-sinuca" name="nome" required>

        <label for="ano-sinuca">Ano:</label>
        <select id="ano-sinuca" name="ano">
          <option value="1">1º ano</option>
          <option value="2">2º ano</option>
          <option value="3">3º ano</option>
        </select>

        <label for="curso-sinuca">Curso:</label>
        <select id="curso-sinuca" name="curso">
          <option value="TMA">TMA</option>
          <option value="TED">TED</option>
          <option value="TST">TST</option>
        </select>

        <label>Escolha o dia:</label>
        <div id="calendario"></div>
        <input type="hidden" id="data-selecionada" required>

        <label for="horario-sinuca">Horário:</label>
        <select id="horario-sinuca" name="horario">
          <option>13h-14h</option>
          <option>14h-15h</option>
          <option>15h-16h</option>
        </select>

        <button type="submit">Agendar</button>
      </form>
    </div>
  </main>

  <footer>
    <p>IFMG Campus Governador Valadares</p>
  </footer>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="calendario.js"></script>
<script type="module" src="agendar.js"></script>
  
 <script type="module" src="calendario.js"></script>
  <script type="module" src="agendar.js"></script>
</body>
</html>
