<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Notícias — Espaço IFMG</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Espaço IFMG</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="agendamento.html">Agendamento</a>
      <a href="blog.html">Notícias</a>
    </nav>
  </header>

  <main>

    <!-- TELA 1: Login -->
    <section id="login-area" class="tela-login">
  <div class="login-caixa">
    <h2>Fazer login</h2>
    <form id="form-login">
      <input type="email" id="email" placeholder="E-mail" required>

     <div class="campo-senha-wrapper">
  <input type="password" id="senha" placeholder="Senha" required>
  <button type="button" id="btn-mostrar-senha" class="btn-olho">
    <span id="icone-olho"></span>
  </button>
</div>

      <label class="manter-login">
        <input type="checkbox" id="manter-login"> Manter login
      </label>

      <button type="submit" class="btn-entrar-circular" aria-label="Entrar">&rarr;</button>
    </form>
    <p id="erro-login" class="erro"></p>
    <p class="esqueceu-senha"><a href="#" id="link-esqueceu-senha">Esqueceu a senha?</a></p>
  </div>
</section>

    <!-- TELA 2: Menu principal -->
    <section id="menu-area" style="display:none;">
      <div class="painel-topo">
        <h2>Painel de Notícias</h2>
        <button id="btn-sair">Logout</button>
      </div>
     <div class="menu-opcoes">
  <button type="button" id="btn-ir-criar" class="menu-card">
    <span class="menu-card-icone">📝</span>
    <span>Criar Notícia</span>
  </button>
  <button type="button" id="btn-ir-postadas" class="menu-card">
    <span class="menu-card-icone">📋</span>
    <span>Notícias Postadas</span>
  </button>
  <button type="button" id="btn-ir-usuario" class="menu-card">
    <span class="menu-card-icone">👤</span>
    <span>Criar Usuário</span>
  </button>
</div>
    </section>

    <!-- TELA 3: Criar/Editar Notícia -->
    <section id="criar-area" style="display:none;">
      <button type="button" id="btn-voltar-criar" class="botao-voltar-painel">&larr; Voltar ao menu</button>
      <h2 id="titulo-tela-criar">Criar Notícia</h2>

      <form id="form-noticia">
        <input type="hidden" id="noticia-id">

        <div class="bloco-form">
          <h3>Informações</h3>
          <label for="titulo">Título:</label>
          <input type="text" id="titulo" required>

          <label for="resumo">Resumo (aparece na prévia):</label>
          <textarea id="resumo" required></textarea>
        </div>

        <div class="bloco-form">
          <h3>Capa</h3>
          <input type="file" id="capa-arquivo" accept="image/*">
          <p id="capa-status" class="status-upload"></p>
          <img id="capa-preview" class="preview-capa" style="display:none;">
        </div>

        <div class="bloco-form">
          <h3>Conteúdo</h3>
          <div class="editor-botoes">
            <button type="button" class="btn-formato" data-comando="bold"><b>N</b></button>
            <button type="button" class="btn-formato" data-comando="italic"><i>I</i></button>
            <button type="button" class="btn-formato" data-comando="underline"><u>S</u></button>
            <select id="seletor-fonte">
              <option value="">Fonte...</option>
              <option value="Poppins">Poppins</option>
              <option value="Georgia">Georgia</option>
              <option value="Courier New">Courier New</option>
              <option value="Comic Sans MS">Comic Sans MS</option>
            </select>
            <button type="button" id="btn-inserir-imagem">🖼️ Imagem</button>
            <button type="button" id="btn-inserir-video">🎬 Vídeo</button>
          </div>
          <div id="editor-conteudo" class="editor-rico" contenteditable="true"></div>
          <input type="file" id="input-imagem-conteudo" accept="image/*" style="display:none;">
        </div>

        <button type="submit" id="btn-salvar">Publicar</button>
      </form>
    </section>

    <!-- TELA 4: Notícias Postadas -->
    <section id="postadas-area" style="display:none;">
     <button type="button" id="btn-voltar-postadas" class="botao-voltar-painel">&larr; Voltar ao menu</button>
      <h2>Notícias Postadas</h2>
      <div class="noticias-grid" id="lista-postadas"></div>
    </section>
<section id="usuario-area" style="display:none;">
  <button type="button" id="btn-voltar-usuario" class="botao-voltar-painel">&larr; Voltar ao menu</button>
  <h2>Criar Usuário</h2>
  <form id="form-usuario">
    <label for="novo-email">E-mail do novo usuário:</label>
    <input type="email" id="novo-email" required>

    <label for="nova-senha">Senha (mínimo 6 caracteres):</label>
    <input type="password" id="nova-senha" minlength="6" required>

    <button type="submit">Criar conta</button>
  </form>
  <p id="usuario-status" class="status-upload"></p>
</section>
  </main>

  <footer>
    <p>IFMG Campus Governador Valadares</p>
  </footer>

  <script type="module" src="admin.js"></script>
  <div id="popup-overlay" class="popup-overlay" style="display:none;">
  <div class="popup-caixa">
    <p id="popup-mensagem"></p>
    <button id="popup-ok">OK</button>
  </div>
</div>
</body>
</html>
