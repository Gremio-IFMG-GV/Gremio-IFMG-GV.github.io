<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Notícias — Espaço IFMG</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Espaço IFMG</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="agendamento.html">Agendamento</a>
      <a href="blog.html">Notícias</a>
    </nav>
  </header>

  <main>

    <!-- TELA 1: Login -->
    <section id="login-area">
      <h2>Painel de Notícias</h2>
      <form id="form-login">
        <label for="email">E-mail:</label>
        <input type="email" id="email" required>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="erro-login" class="erro"></p>
    </section>

    <!-- TELA 2: Menu principal -->
    <section id="menu-area" style="display:none;">
      <div class="painel-topo">
        <h2>Painel de Notícias</h2>
        <button id="btn-sair">Sair</button>
      </div>
      <div class="menu-opcoes">
        <button type="button" id="btn-ir-criar" class="menu-card">
          <span class="menu-card-icone">📝</span>
          <span>Criar Notícia</span>
        </button>
        <button type="button" id="btn-ir-postadas" class="menu-card">
          <span class="menu-card-icone">📋</span>
          <span>Notícias Postadas</span>
        </button>
      </div>
    </section>

    <!-- TELA 3: Criar/Editar Notícia -->
    <section id="criar-area" style="display:none;">
      <button type="button" id="btn-voltar-criar" class="botao-suave">&larr; Voltar ao menu</button>
      <h2 id="titulo-tela-criar">Criar Notícia</h2>

      <form id="form-noticia">
        <input type="hidden" id="noticia-id">

        <div class="bloco-form">
          <h3>Informações</h3>
          <label for="titulo">Título:</label>
          <input type="text" id="titulo" required>

          <label for="resumo">Resumo (aparece na prévia):</label>
          <textarea id="resumo" required></textarea>
        </div>

        <div class="bloco-form">
          <h3>Capa</h3>
          <input type="file" id="capa-arquivo" accept="image/*">
          <p id="capa-status" class="status-upload"></p>
          <img id="capa-preview" class="preview-capa" style="display:none;">
        </div>

        <div class="bloco-form">
          <h3>Conteúdo</h3>
          <div class="editor-botoes">
            <button type="button" id="btn-inserir-imagem">🖼️ Inserir imagem aqui</button>
            <button type="button" id="btn-inserir-video">🎬 Inserir vídeo aqui</button>
          </div>
          <div id="editor-conteudo" class="editor-rico" contenteditable="true"></div>
          <input type="file" id="input-imagem-conteudo" accept="image/*" style="display:none;">
        </div>

        <button type="submit" id="btn-salvar">Publicar</button>
      </form>
    </section>

    <!-- TELA 4: Notícias Postadas -->
    <section id="postadas-area" style="display:none;">
      <button type="button" id="btn-voltar-postadas" class="botao-suave">&larr; Voltar ao menu</button>
      <h2>Notícias Postadas</h2>
      <div class="noticias-grid" id="lista-postadas"></div>
    </section>

  </main>

  <footer>
    <p>IFMG Campus Governador Valadares</p>
  </footer>

  <script type="module" src="admin.js"></script>
</body>
</html>
